<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">GameServer 服务拓扑与连接流程</title>
  <desc id="desc">Unity 客户端通过 Gate 完成登录和服务发现，可由 Gate 转发请求，也可使用 TCP 或 KCP 直连 Game001 Room Worker。Center 负责认证、服务注册和票据校验。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b31"/>
      <stop offset="1" stop-color="#111a37"/>
    </linearGradient>
    <linearGradient id="clientFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d57"/>
      <stop offset="1" stop-color="#102b46"/>
    </linearGradient>
    <linearGradient id="gateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#193968"/>
      <stop offset="1" stop-color="#18264d"/>
    </linearGradient>
    <linearGradient id="centerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303071"/>
      <stop offset="1" stop-color="#222653"/>
    </linearGradient>
    <linearGradient id="roomFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123652"/>
      <stop offset="1" stop-color="#162747"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020817" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39d9ff"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78a6ff"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a58bff"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f3f7ff; }
      .subtitle { font: 400 15px Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8fa8c9; letter-spacing: 0.5px; }
      .node-title { font: 700 20px Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f6f9ff; }
      .node-subtitle { font: 500 14px Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9db7d8; }
      .group-title { font: 700 19px Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dcecff; }
      .edge-label { font: 500 13px Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b9cee8; }
      .legend { font: 500 13px Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8fa8c9; }
      .edge-cyan { fill: none; stroke: #39d9ff; stroke-width: 2.5; marker-end: url(#arrowCyan); }
      .edge-blue { fill: none; stroke: #78a6ff; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .edge-violet { fill: none; stroke: #a58bff; stroke-width: 2.5; marker-end: url(#arrowViolet); }
      .control-edge { fill: none; stroke: #a58bff; stroke-width: 2.2; stroke-dasharray: 7 7; marker-end: url(#arrowViolet); }
      .inner-edge { fill: none; stroke: #4e769f; stroke-width: 2; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#background)"/>
  <path d="M0 120 H1400 M0 240 H1400 M0 360 H1400 M0 480 H1400 M0 600 H1400 M200 0 V760 M400 0 V760 M600 0 V760 M800 0 V760 M1000 0 V760 M1200 0 V760"
        stroke="#173152" stroke-width="1" opacity="0.22"/>
  <circle cx="1200" cy="90" r="230" fill="#193768" opacity="0.12"/>
  <circle cx="210" cy="620" r="250" fill="#0d6480" opacity="0.09"/>

  <text x="60" y="62" class="title">服务拓扑与连接流程</text>
  <text x="60" y="91" class="subtitle">CENTER · GATE · GAME001 ROOM WORKER · TCP / KCP</text>

  <!-- Edges behind nodes -->
  <path class="edge-cyan" d="M280 340 H360"/>
  <rect x="283" y="299" width="75" height="23" rx="11.5" fill="#0c1b31" stroke="#21506b"/>
  <text x="320.5" y="315" text-anchor="middle" class="edge-label">登录 / 路由</text>

  <path class="edge-violet" d="M560 319 C610 319 610 200 660 200"/>
  <rect x="566" y="237" width="104" height="23" rx="11.5" fill="#0c1b31" stroke="#4c4289"/>
  <text x="618" y="253" text-anchor="middle" class="edge-label">认证 / 服务发现</text>

  <path class="edge-blue" d="M560 356 C620 356 649 422 710 422"/>
  <rect x="591" y="365" width="91" height="23" rx="11.5" fill="#0c1b31" stroke="#344f83"/>
  <text x="636.5" y="381" text-anchor="middle" class="edge-label">Forward 转发</text>

  <path class="edge-cyan" d="M170 400 C170 620 484 690 710 573"/>
  <rect x="320" y="633" width="212" height="25" rx="12.5" fill="#0c1b31" stroke="#21506b"/>
  <text x="426" y="650" text-anchor="middle" class="edge-label">握手 · 请求 · Command · Push</text>

  <path class="control-edge" d="M770 260 V300"/>
  <rect x="801" y="268" width="152" height="23" rx="11.5" fill="#0c1b31" stroke="#4c4289"/>
  <text x="877" y="284" text-anchor="middle" class="edge-label">服务注册 / 票据校验</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="60" y="280" width="220" height="120" rx="20" fill="url(#clientFill)" stroke="#21b9d9" stroke-width="1.5"/>
    <rect x="82" y="305" width="54" height="41" rx="5" fill="#071624" stroke="#4ddfff" stroke-width="2"/>
    <path d="M91 354 H127 M104 346 V354 M114 346 V354" stroke="#4ddfff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="109" cy="325" r="8" fill="#1b96b6"/>
    <text x="155" y="330" class="node-title">Unity 客户端</text>
    <text x="155" y="356" class="node-subtitle">gRPC + 实时连接</text>
  </g>

  <!-- Gate -->
  <g filter="url(#shadow)">
    <rect x="360" y="280" width="200" height="120" rx="20" fill="url(#gateFill)" stroke="#6d9eff" stroke-width="1.5"/>
    <path d="M392 310 L416 300 L440 310 V329 C440 344 430 355 416 361 C402 355 392 344 392 329 Z"
          fill="#152e55" stroke="#84adff" stroke-width="2"/>
    <path d="M407 330 L414 337 L428 319" fill="none" stroke="#59dcff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="458" y="329" class="node-title">Gate</text>
    <text x="458" y="355" class="node-subtitle">gRPC :5002</text>
  </g>

  <!-- Center -->
  <g filter="url(#shadow)">
    <rect x="660" y="140" width="220" height="120" rx="20" fill="url(#centerFill)" stroke="#9e8cff" stroke-width="1.5"/>
    <ellipse cx="706" cy="174" rx="27" ry="10" fill="#292b60" stroke="#b1a5ff" stroke-width="2"/>
    <path d="M679 174 V210 C679 216 691 221 706 221 C721 221 733 216 733 210 V174"
          fill="#292b60" stroke="#b1a5ff" stroke-width="2"/>
    <path d="M679 190 C679 196 691 201 706 201 C721 201 733 196 733 190" fill="none" stroke="#b1a5ff" stroke-width="2"/>
    <text x="751" y="190" class="node-title">Center</text>
    <text x="751" y="216" class="node-subtitle">gRPC :5001</text>
    <circle cx="850" cy="168" r="4" fill="#b1a5ff" filter="url(#glow)"/>
  </g>

  <!-- Worker group -->
  <g filter="url(#shadow)">
    <rect x="650" y="300" width="680" height="380" rx="26" fill="#0a1728" fill-opacity="0.9" stroke="#2b5981" stroke-width="1.5"/>
    <path d="M650 348 H1330" stroke="#234464" stroke-width="1"/>
    <circle cx="680" cy="324" r="5" fill="#39d9ff"/>
    <text x="696" y="331" class="group-title">Game001 Room Worker</text>
    <text x="1289" y="330" text-anchor="end" class="node-subtitle">worker-001</text>
  </g>

  <!-- Ingress -->
  <g>
    <rect x="710" y="370" width="220" height="105" rx="18" fill="url(#roomFill)" stroke="#6e9ee7" stroke-width="1.4"/>
    <path d="M741 402 H775 M741 415 H775 M741 428 H763" stroke="#78a6ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="786" cy="402" r="3" fill="#39d9ff"/>
    <circle cx="786" cy="415" r="3" fill="#39d9ff"/>
    <text x="809" y="414" class="node-title">GameIngress</text>
    <text x="809" y="440" class="node-subtitle">gRPC :5101</text>
  </g>

  <!-- Direct -->
  <g>
    <rect x="710" y="520" width="220" height="105" rx="18" fill="url(#clientFill)" stroke="#32c7df" stroke-width="1.4"/>
    <circle cx="754" cy="565" r="19" fill="none" stroke="#48d9ef" stroke-width="2"/>
    <circle cx="754" cy="565" r="5" fill="#48d9ef"/>
    <path d="M754 546 V534 M754 596 V584 M735 565 H723 M785 565 H773" stroke="#48d9ef" stroke-width="2" stroke-linecap="round"/>
    <text x="792" y="563" class="node-title">实时连接</text>
    <text x="792" y="589" class="node-subtitle">TCP / KCP :6101</text>
  </g>

  <!-- Runtime -->
  <g>
    <rect x="1040" y="430" width="240" height="135" rx="20" fill="url(#gateFill)" stroke="#7c91ff" stroke-width="1.5"/>
    <g transform="translate(1068 460)">
      <path d="M0 10 L22 0 L44 10 L22 20 Z" fill="#294b80" stroke="#89acff" stroke-width="1.5"/>
      <path d="M0 25 L22 15 L44 25 L22 35 Z" fill="#223c6a" stroke="#7398ea" stroke-width="1.5"/>
      <path d="M0 40 L22 30 L44 40 L22 50 Z" fill="#1d325b" stroke="#5f83d0" stroke-width="1.5"/>
    </g>
    <text x="1131" y="482" class="node-title">Room Runtime</text>
    <text x="1131" y="508" class="node-subtitle">Fiber + ECS World</text>
    <text x="1131" y="532" class="node-subtitle">固定帧率 · 状态同步</text>
  </g>

  <path class="inner-edge" d="M930 422 C977 422 992 466 1040 478"/>
  <path class="inner-edge" d="M930 573 C981 573 995 529 1040 517"/>

  <!-- Legend -->
  <line x1="60" y1="718" x2="96" y2="718" stroke="#39d9ff" stroke-width="2.5"/>
  <text x="108" y="723" class="legend">客户端数据路径</text>
  <line x1="255" y1="718" x2="291" y2="718" stroke="#78a6ff" stroke-width="2.5"/>
  <text x="303" y="723" class="legend">服务转发路径</text>
  <line x1="450" y1="718" x2="486" y2="718" stroke="#a58bff" stroke-width="2.2" stroke-dasharray="7 7"/>
  <text x="498" y="723" class="legend">控制面交互</text>
</svg>
